<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="scripts/contact.js" defer></script>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <title>Contact Form</title>
</head>
<body>
    <div id="main">
        <h1>Contact Form</h1>

        <form id="main-form" action="#" method="get">
            <!-- Contact info -->
             <div id="contact-info">
                 <div class="field">
                     <label for="first-name">First Name</label>
                     <input type="text" id="first-name" name="first-name">
                 </div>
 
                 <div class="field">
                     <label for="last-name">Last Name</label>
                     <input type="text" id="last-name" name="last-name">
                 </div>

                 <div class="field">
                     <label for="job-title">Job Title</label>
                     <input type="text" id="job-title" name="job-title">
                 </div>
 
                 <div class="field">
                     <label for="company">Company</label>
                     <input type="text" id="company" name="company">
                 </div>
                 
                 <div class="field">
                     <label for="linkedin-url">Linkedin URL</label>
                     <input type="url" id="linkedin-url" name="linkedin-url">
                 </div>
 
                 <div class="field">
                     <label for="email">Email Address</label>
                     <input type="email" id="email" name="email">
                 </div>
             </div>

            <!-- How did we meet section -->
             <div id="question">
                <div class="field">
                    <label for="meet-question">How did we meet?</label>
                    <select id="meet-question">
                        <option value="none">Please select an option</option>
                        <option value="event">At an event</option>
                        <option value="linkedin">Linkedin</option>
                        <option value="referral">Referral</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="field">
                    <label for="other">Other (please specify)</label>
                    <input type="text" id="other" name="other">
                </div>                
             </div>

            <!-- Message section -->
             <div id="message-section">
                <div class="field">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4"></textarea>
                </div>

                <div>
                    <input type="checkbox" id="mailing-list" name="mailing-list">
                    <label for="mailing-list">Please add me to your mailing list</label>
                </div>
             </div>

             
            <button type="submit">Submit</button>
        </form>

    </div>
</body>
</html>
